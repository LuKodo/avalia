# =============================================================================
#  Avalia Logistica - sitio seguro
# -----------------------------------------------------------------------------
#  Copiar a:  C:\xampp\apache\conf\extra\avalia-ssl.conf
#
#  Y anadir a httpd.conf, junto a la linea de ceimabby:
#      Include conf/extra/avalia-ssl.conf
#
#  Escrito con la misma estructura que ceimabby-ssl.conf, para que quien lo
#  mantenga despues no tenga que aprender dos formas de hacer lo mismo.
# =============================================================================

<VirtualHost *:443>
    ServerName plataforma.avalia.com.co

    # ------------------------------------------------------------------------
    #  La raiz web es `public`, NO la carpeta del proyecto.
    #
    #  Es la diferencia mas importante respecto a ceimabby. Una aplicacion
    #  Laravel guarda fuera de `public` el .env con las contrasenas, `vendor`,
    #  `storage` y todo el codigo. Si la raiz apuntara un nivel mas arriba,
    #  todo eso quedaria descargable desde internet.
    # ------------------------------------------------------------------------
    DocumentRoot "C:/xampp/htdocs/Avalia/public"
    DirectoryIndex index.php

    <Directory "C:/xampp/htdocs/Avalia/public">
        Options -Indexes +FollowSymLinks

        # Necesario: public/.htaccess reescribe toda direccion hacia index.php.
        # Sin esto responde la pagina de inicio y nada mas.
        AllowOverride All

        Require all granted
    </Directory>

    # Cinturon ademas de los tirantes: aunque alguien cambie el DocumentRoot
    # por error, el resto del proyecto sigue sin servirse.
    <Directory "C:/xampp/htdocs/Avalia">
        Require all denied
    </Directory>

    # ------------------------------------------------------------------------
    #  Certificado
    # ------------------------------------------------------------------------
    SSLEngine on
    SSLCertificateFile    "C:/xampp/apache/conf/ssl.crt/plataforma.avalia.com.co-chain.pem"
    SSLCertificateKeyFile "C:/xampp/apache/conf/ssl.crt/plataforma.avalia.com.co-key.pem"
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    ErrorLog  "logs/avalia-ssl-error.log"
    CustomLog "logs/avalia-ssl-access.log" common
</VirtualHost>
